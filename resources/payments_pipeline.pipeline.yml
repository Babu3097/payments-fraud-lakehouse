# One Lakeflow pipeline for all layers: Free Edition allows a single active pipeline per type
# (ADR-009). Datasets use fully qualified names, so each lands in its own schema.
resources:
  pipelines:
    payments_pipeline:
      name: payments_lakehouse_pipeline
      catalog: ${var.catalog}
      schema: bronze # default only; every dataset names its own schema
      serverless: true
      continuous: false # triggered runs: process the new files, then stop
      root_path: ../pipelines
      configuration:
        # Event dates are derived from timestamps, so the time zone must never depend on a default.
        spark.sql.session.timeZone: UTC
      # The API only accepts a plain `**` here (no `**/*.py`). One line per layer folder, so the
      # README in pipelines/ is never treated as pipeline code.
      libraries:
        - glob:
            include: ../pipelines/bronze/**
        - glob:
            include: ../pipelines/silver/**
        - glob:
            include: ../pipelines/gold/**
